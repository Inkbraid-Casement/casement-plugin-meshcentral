name: Release

# Pushing a tag like v0.1.0 builds and tests the plugin and publishes a
# release with the zip. GitHub adds the tag's source archives to every
# release, which keeps each binary next to its corresponding source.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\([^)]*VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != version $version" }
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -L unit
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/meshcentral | Out-Null
          Copy-Item build/casement-meshcentral.exe, plugin.json, icon.png, LICENSE, README.md, CHANGELOG.md dist/meshcentral/
          Compress-Archive -Path dist/meshcentral -DestinationPath "casement-meshcentral-${{ github.ref_name }}-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: casement-meshcentral-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
